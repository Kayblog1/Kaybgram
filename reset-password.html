<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Reset Password - Kaybgram</title>  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 14px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
    }

    p {
      color: #cccccc;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input {
      background: #292929;
      color: white;
      border: 1px solid #444444;
    }

    button {
      background: #ffffff;
      color: #111111;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
    }
  </style></head><body>
  <main class="container">
    <h2>Reset your password</h2>
    <p>Enter a new password for your Kaybgram account.</p><form id="resetForm">
  <input
    id="password"
    type="password"
    placeholder="New password (at least 8 characters)"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <input
    id="confirmPassword"
    type="password"
    placeholder="Confirm new password"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <button id="resetButton" type="submit">Update Password</button>
</form>

<p id="message" role="status"></p>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="supabase.js"></script>  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Your password must contain at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      if (!window.supabaseClient) {
        message.textContent =
          "Connection error. Please refresh and try again.";
        return;
      }

      button.disabled = true;
      message.textContent = "Updating your password...";

      try {
        const { error } = await window.supabaseClient.auth.updateUser({
          password: password
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        message.textContent =
          "Password updated successfully! You can now log in.";

        setTimeout(function () {
          window.location.href = "login.html";
        }, 2000);
      } catch (error) {
        message.textContent =
          "Something went wrong. Please open the reset link again.";
      } finally {
        button.disabled = false;
      }
    });
  </script></body>
</html>￼Enter
