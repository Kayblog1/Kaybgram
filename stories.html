<!<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaybgram - Stories</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:80px}
header{padding:12px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.stories{display:flex;gap:10px;overflow-x:auto;padding:12px}
.story{flex:0 0 70px;text-align:center}
.ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#CCFF00,#FF2D95);display:flex;align-items:center;justify-content:center}
.ring img{width:100%;height:100%;border-radius:50%;border:2px solid #000;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.grid img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid #222}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px}
.nav a{color:#fff;text-decoration:none;font-size:11px;text-align:center;opacity:.5}.nav a.active{opacity:1;color:#CCFF00}
</style>
</head>
<body>
<header><b style="font-family:'Syne'">STORIES ✨</b><a href="app.html" style="color:#fff;text-decoration:none;border:1px solid #333;padding:6px 12px;border-radius:100px;font-size:11px">Back</a></header>

<div style="max-width:600px;margin:0 auto">
<div style="padding:10px">
<input type="file" id="f" accept="image/*" style="width:100%;background:#111;border:1px solid #222;color:#fff;padding:10px;border-radius:10px">
<button onclick="postStory()" style="width:100%;margin-top:8px;background:#CCFF00;color:#000;border:none;padding:12px;border-radius:100px;font-weight:700">Add to Story ✨ (24h)</button>
<p id="st" style="font-size:11px;text-align:center;color:#CCFF00"></p>
</div>

<div class="stories" id="top"></div>
<div class="grid" id="grid"></div>
</div>

<div class="nav">
<a href="app.html"><div>⌂</div>Feed</a>
<a href="chat.html"><div>💬</div>Chat</a>
<a href="stories.html" class="active"><div>✨</div>Story</a>
<a href="music.html"><div>🎵</div>Music</a>
</div>￼Enter
