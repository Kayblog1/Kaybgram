<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stories — Kaybgram</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#09090b;color:#fff;font-family:system-ui;padding-bottom:90px}header{position:sticky;top:0;background:rgba(9,9,11,.95);backdrop-filter:blur(20px);border-bottom:1px solid #232326;padding:14px 16px;display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.logo span{color:#CCFF00}.create{background:#121214;border:1px solid #232326;border-radius:22px;margin:12px;padding:16px;max-width:600px;margin:12px auto}.drop{border:1.5px dashed #2a2a2e;background:#1c1c1f;border-radius:16px;padding:26px;text-align:center;cursor:pointer}.btn{width:100%;background:#CCFF00;color:#000;border:none;border-radius:100px;padding:14px;font-weight:800;margin-top:12px}.ring{width:64px;height:64px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#CCFF00,#FF2D95);display:flex;align-items:center;justify-content:center}.ring img{width:100%;height:100%;border-radius:50%;border:2.5px solid #09090b;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-width:600px;margin:0 auto}.grid img{width:100%;height:220px;object-fit:cover;border-radius:18px;border:1px solid #232326}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#18181b;border:1px solid #2a2a2e;border-radius:100px;padding:6px;display:flex;gap:4px}.nav a{color:#a1a1aa;text-decoration:none;font-size:11px;font-weight:700;padding:9px 18px;border-radius:100px;text-align:center}.nav a.active{background:#fff;color:#000}#f{display:none!important}</style></head><body><header><div class="logo">STORIES<span>.</span></div><a href="app.html" style="color:#fff;text-decoration:none;border:1px solid #232326;padding:6px 14px;border-radius:100px;font-size:11px">Back</a></header><div class="create"><b style="font-size:14px">Add to Story (24h)</b><div class="drop" onclick="document.getElementById('f').click()" style="margin-top:12px"><span id="stxt">✦ Tap to add story</span></div><input type="file" id="f" accept="image/*"><img id="prev" style="width:100%;border-radius:16px;margin-top:12px;display:none;max-height:380px;object-fit:cover"><button class="btn" onclick="postStory()">Post Story →</button><p id="status" style="text-align:center;font-size:11px;color:#CCFF00;margin-top:8px"></p></div><div style="display:flex;gap:12px;overflow-x:auto;padding:14px 12px;max-width:600px;margin:0 auto" id="top"></div><div class="grid" id="grid"></div><div class="nav"><a href="app.html">⌂<br>Feed</a><a href="chat.html">💬<br>Chat</a><a href="stories.html" class="active">✦<br>Story</a><a href="music.html">♫<br>Music</a></div><script>const supa=supabase.createClient("https://qpwmlpisveearglmagvt.supabase.co","sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB");let user=localStorage.getItem('kayb_user');if(!user)location.href='index.html';let fileData="";document.getElementById('f').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;document.getElementById('stxt').textContent='✓ Ready: '+file.name.substring(0,20);const r=new FileReader();r.onload=ev=>{fileData=ev.target.result;const p=document.getElementById('prev');p.src=fileData;p.style.display='block';};r.readAsDataURL(file);});async function load(){const {data}=await supa.from('stories').select('*').order('created_at',{ascending:false});const valid=(data||[]).filter(s=>(Date.now()-new Date(s.created_at).getTime())<86400000);document.getElementById('top').innerHTML=valid.map(s=>`<div style="text-align:center;flex:0 0 72px"><div class="ring"><img src="${s.image_url}"></div><div style="font-size:10px;margin-top:6px;white-space:nowrap;overflow:hidden">${s.username}</div></div>`).join('')||'<p style="opacity:.4;font-size:12px;padding:10px">No stories - be first!</p>';document.getElementById('grid').innerHTML=valid.map(s=>`<img src="${s.image_url}">`).join('');}async function postStory(){if(!fileData)return alert('Pick photo first');document.getElementById('status').textContent='Posting...';await supa.from('stories').insert([{username:user,image_url:fileData}]);document.getElementById('status').textContent='✦ Added!';fileData='';document.getElementById('prev').style.display='none';load();}load();</script></body></html>
