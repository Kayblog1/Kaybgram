<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kaybgram - Feed</title>

  <link rel="stylesheet" href="css/feed.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      color: #29213d;
    }

    .navbar {
      background: #6c2bd9;
      color: white;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navbar h1 {
      margin: 0;
      font-size: 26px;
    }

    .navbar nav {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .navbar .join {
      background: white;
      color: #6c2bd9;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .welcome {
      background: linear-gradient(135deg, #6c2bd9, #a855f7);
      color: white;
      padding: 25px 20px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .create-post,
    .feed {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(60, 30, 100, 0.08);
    }

    .create-post h3,
    .feed h3 {
      color: #6c2bd9;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 13px;
      border: 1px solid #ded3f7;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      resize: vertical;
      margin-bottom: 15px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }

    button {
      background: #6c2bd9;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5420b5;
    }

    .post {
      padding: 16px 0;
      border-bottom: 1px solid #eee;
      overflow-wrap: anywhere;
    }

    .post p {
      line-height: 1.6;
    }

    .post img {
      display: block;
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .post small {
      color: #81758f;
    }

    .empty {
      color: #81758f;
      text-align: center;
      padding: 20px 5px;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #81758f;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .navbar {
        padding: 16px 4%;
      }

      .navbar h1 {
        font-size: 23px;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <h1>Kaybgram 💜</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Sign In</a>
      <a href="register.html" class="join">Join</a>
    </nav>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Welcome to Kaybgram 💜</h2>
      <p>Share your moments. Connect with everyone.</p>
    </section>

    <section class="create-post">
      <h3>Create a post</h3>

      <textarea
        id="caption"
        placeholder="What's on your mind?"
      ></textarea>

      <input
        type="file"
        id="photo"
        accept="image/*"
      >

      <button type="button" id="postButton">
        Post
      </button>
    </section>

    <section class="feed">
      <h3>Latest Posts</h3>

      <div id="posts">
        <p class="empty">
          Your feed is waiting for your first post! 💜
        </p>
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 Kaybgram. Connect your world.</p>
  </footer>

  <!-- Connect to your existing JavaScript file -->
  <script src="js/js/feed.js"></script>

</body>
  </html>
