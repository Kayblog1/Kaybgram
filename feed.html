<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaybgram - Feed</title>
  <link rel="stylesheet" href="css/feed.css">
</head>
<body>

  <header class="navbar">
    <h1>Kaybgram</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Sign In</a>
      <a href="register.html" class="join">Join</a>
    </nav>
  </header>

  <main class="container">
    <section class="welcome">
      <h2>Welcome to Kaybgram 💜</h2>
      <p>Share your moments. Connect with everyone.</p>
    </section>

    <section class="create-post">
      <h3>Create a post</h3>
      <textarea id="caption" placeholder="What's on your mind?"></textarea>
      <input type="file" id="photo" accept="image/*">
      <button id="postButton">Post</button>
    </section>

    <section class="feed">
      <h3>Latest Posts</h3>
      <div id="posts">
        <p class="empty">Your feed is waiting for your first post! 💜</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Kaybgram. Connect your world.</p>
  </footer>

</body>
</html>￼Enter
