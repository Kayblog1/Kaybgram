<style>
:root{--bg:#000;--card:#121212;--card2:#1E1E1E;--border:#2A2A2A;--lime:#CCFF00;--pink:#FF2D95}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:'Space Grotesk';padding-bottom:80px;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid var(--border);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne';font-weight:800;font-size:20px;letter-spacing:-0.5px;white-space:nowrap}.logo span{color:var(--lime)}
.login-screen{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;width:100%;max-width:340px}
.login-box h1{font-family:'Syne';font-size:24px;text-align:center}.login-box h1 span{color:var(--lime)}
.login-box input{margin-top:10px;background:var(--card2);border:1px solid var(--border);color:#fff;padding:12px;border-radius:12px;width:100%;font-size:14px}
.btn{border:none;padding:12px;border-radius:100px;font-weight:700;cursor:pointer;font-family:'Space Grotesk';width:100%}.btn-lime{background:var(--lime);color:#000}.btn-ghost{background:var(--card2);color:#fff;border:1px solid var(--border);margin-top:8px}
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 12px}.story{flex:0 0 58px;text-align:center}.ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--lime),var(--pink));display:flex;align-items:center;justify-content:center}.ring img{width:100%;height:100%;border-radius:50%;border:2px solid #000;object-fit:cover}
.search-bar{margin:8px 12px;background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:8px 14px;display:flex;gap:8px}.search-bar input{background:transparent;border:none;color:#fff;outline:none;width:100%;font-size:13px}
.create{background:var(--card);border:1px solid var(--border);border-radius:18px;margin:8px 12px;padding:12px}
.file-zone{border:1.5px dashed var(--border);border-radius:12px;padding:10px;text-align:center;background:var(--card2);font-size:12px}
#preview,#previewVideo{width:100%;border-radius:12px;margin-top:8px;display:none;max-height:300px;object-fit:cover}
.music-list{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.music-chip{flex:0 0 auto;background:#000;border:1px solid var(--border);padding:5px 10px;border-radius:100px;font-size:11px;cursor:pointer;white-space:nowrap}.music-chip.active{background:var(--lime);color:#000}
.card{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:6px}.card-top{padding:8px 12px;display:flex;justify-content:space-between}.avatar{width:32px;height:32px;border-radius:50%;background:var(--lime);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.media-wrap img,.media-wrap video{width:100%;display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:40}.nav-item{text-align:center;opacity:0.5;font-size:9px;cursor:pointer}.nav-item.active{opacity:1}.nav-item div{font-size:18px}
.chat-modal{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}.chat-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;background:var(--card)}.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}.msg{max-width:75%;padding:8px 10px;border-radius:14px;font-size:13px}.msg.me{background:var(--lime);color:#000;align-self:flex-end}.msg.other{background:var(--card2);border:1px solid var(--border);align-self:flex-start}.chat-input{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px;background:var(--card)}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">

<div class="music-list" id="musicList">
<div class="music-chip active" data-url="" data-title="">🔇 No Music</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" data-title="Ayra Starr">Ayra</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" data-title="Burna Boy">Burna</div>

</div>
<button class="btn btn-lime" style="margin-top:8px;font-size:13px" id="shareBtn" onclick="createPost()">Drop to Kaybgram →</button>
<p id="status" style="font-size:10px;text-align:center;margin-top:4px"></p>
</div>
<div id="feed"></div>
</div>
</div>

<div class="chat-modal" id="chatModal">
<div class="chat-header"><div><b id="chatName">Global Chat 💬</b></div><button style="background:var(--card2);color:#fff;border:1px solid var(--border);padding:5px 10px;border-radius:100px" onclick="closeChat()">✕</button></div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-input"><input id="chatInput" placeholder="Type..." style="flex:1;background:var(--card2);border:1px solid var(--border);color:#fff;padding:9px 12px;border-radius:100px;outline:none"><button class="btn btn-lime" style="width:auto;padding:9px 16px;border-radius:100px" onclick="sendMessage()">Send</button></div>
</div>

<div class="bottom-nav">
<div class="nav-item active"><div>⌂</div>Home</div>
<div class="nav-item" onclick="openChat()"><div>💬</div>Chat</div>
<div class="nav-item" onclick="document.getElementById('fileInput').click()"><div>+</div>Post</div>
<div class="nav-item" onclick="logout()"><div>◍</div>You</div>
</div>

<script>
const SUPABASE_URL="https://qpwmlpisveearglmagvt.supabase.co";
const SUPABASE_KEY="sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=localStorage.getItem('kayb_user')||null;
let fileData="",fileType="image",mode="feed",selectedMusicUrl="",selectedMusicTitle="",allPosts=[],chatTarget="global";
function checkLogin(){if(currentUser){document.getElementById('loginScreen').style.display='none';document.getElementById('currentUserLabel').textContent='@'+currentUser;}else{document.getElementById('loginScreen').style.display='flex';}}
checkLogin();

// THIS ONE CANNOT FAIL - Direct login
function forceLogin(){
 const u=document.getElementById('loginUser').value.trim()||'Kayb';
 const p=document.getElementById('loginPass').value.trim()||'1234';
 document.getElementById('loginStatus').textContent='Logging in...';
 localStorage.setItem('kayb_user',u);
 currentUser=u;
 // Save silently
 try{supabaseClient.from('profiles').upsert([{username:u,password:p}],{onConflict:'username'});}catch(e){}
 setTimeout(()=>{checkLogin();loadAll();},300);
}
function logout(){localStorage.removeItem('kayb_user');currentUser=null;location.reload();}
document.querySelectorAll('.music-chip').forEach(c=>{c.onclick=()=>{document.querySelectorAll('.music-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');selectedMusicUrl=c.dataset.url;selectedMusicTitle=c.dataset.title;}});
function setMode(m){mode=m;document.getElementById('storyTab').style.background=m==='story'?'var(--lime)':'transparent';document.getElementById('storyTab').style.color=m==='story'?'#000':'#fff';document.getElementById('shareBtn').textContent=m==='story'?'Add to Story ✨':'Drop to Kaybgram →';}
document.getElementById('fileInput').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;fileType=file.type.startsWith('video')?'video':'image';
 const reader=new FileReader();reader.onload=ev=>{
  if(fileType==='image'){
   const img=new Image();img.onload=()=>{
    const canvas=document.createElement('canvas');const max=720;let w=img.width,h=img.height;if(w>max){h*=max/w;w=max}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
    fileData=canvas.toDataURL('image/jpeg',0.68);document.getElementById('preview').src=fileData;document.getElementById('preview').style.display='block';document.getElementById('previewVideo').style.display='none';
   };img.src=ev.target.result;
  }else{fileData=ev.target.result;document.getElementById('previewVideo').src=fileData;document.getElementById('previewVideo').style.display='block';document.getElementById('preview').style.display='none';}
  document.getElementById('zoneText').textContent=file.name;
 };reader.readAsDataURL(file);
});
async function loadAll(){
 try{
  const {data:posts}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false});
  allPosts=posts||[];
  const feed=document.getElementById('feed');feed.innerHTML="";
  (posts||[]).forEach(p=>{
   const isV=p.image_url?.startsWith('data:video');
   const media=isV?`<video src="${p.image_url}" controls playsinline style="width:100%"></video>`:`<img src="${p.image_url}" style="width:100%">`;
   const music=p.music_url?`<div style="position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,0.7);border-radius:100px;padding:4px 8px;font-size:10px">🎵 ${p.music_title}</div>`:"";
   feed.innerHTML+=`<div class="card"><div class="card-top"><div style="display:flex;gap:8px;align-items:center"><div class="avatar">${(p.username||'K')[0]}</div><b style="font-size:13px">${p.username}</b></div><span style="font-size:10px;opacity:0.4" onclick="deletePost(${p.id})">Delete</span></div><div class="media-wrap" style="position:relative">${media}${music}</div><div style="padding:6px 12px"><span onclick="likePost(${p.id},${p.likes||0})" style="font-size:13px">❤️ ${p.likes||0}</span><div style="font-size:12px;margin-top:2px"><b>${p.username}</b> ${p.caption||''}</div></div></div>`;
  });
  const {data:storiesData}=await supabaseClient.from('stories').select('*').order('created_at',{ascending:false});
  const valid=(storiesData||[]).filter(s=>(Date.now()-new Date(s.created_at).getTime())<86400000);
  document.getElementById('stories').innerHTML=`<div class="story" onclick="document.getElementById('fileInput').click();setMode('story')"><div class="ring" style="background:#222"><span>+</span></div><b style="font-size:9px">Add</b></div>`+valid.map(s=>`<div class="story"><div class="ring"><img src="${s.image_url}"></div><b style="font-size:9px">${s.username}</b></div>`).join('');
 }catch(e){console.log(e);}
}
async function createPost(){
 if(!currentUser){forceLogin();return;}
 const caption=document.getElementById('caption').value;const btn=document.getElementById('shareBtn');const status=document.getElementById('status');
 if(!fileData){status.textContent="Pick photo first!";return;}
 btn.textContent="Posting...";btn.disabled=true;
 const table=mode==='story'?'stories':'posts';
 const {error}=await supabaseClient.from(table).insert([{caption,image_url:fileData,username:currentUser,type:fileType,likes:0,music_url:selectedMusicUrl,music_title:selectedMusicTitle}]);
 if(error){status.textContent=error.message;btn.disabled=false;btn.textContent="Drop →";}
 else{status.textContent="Done! 🔥";fileData="";document.getElementById('preview').style.display='none';document.getElementById('previewVideo').style.display='none';document.getElementById('caption').value="";btn.disabled=false;setMode('feed');loadAll();}
}
async function likePost(id,c){await supabaseClient.from('posts').update({likes:c+1}).eq('id',id);loadAll();}
async function deletePost(id){if(!confirm('Delete?'))return;await supabaseClient.from('posts').delete().eq('id',id);loadAll();}
function doSearch(){
 const q=document.getElementById('searchInput').value.toLowerCase();const res=document.getElementById('searchResults');const main=document.getElementById('mainContent');
 if(!q){res.style.display='none';main.style.display='block';return;}
 main.style.display='none';res.style.display='block';
 const filtered=allPosts.filter(p=>p.username?.toLowerCase().includes(q)||p.caption?.toLowerCase().includes(q));
 res.innerHTML=filtered.map(p=>`<div style="padding:8px;background:#111;border:1px solid #222;border-radius:12px;margin-bottom:6px;font-size:13px"><b>${p.username}</b> - ${p.caption||''}</div>`).join('')||'No results';
}
async function openChat(){document.getElementById('chatModal').style.display='flex';loadMessages();}
function closeChat(){document.getElementById('chatModal').style.display='none';}
async function loadMessages(){
 try{
  const {data}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:true}).limit(100);
  const box=document.getElementById('chatMessages');box.innerHTML="";
  (data||[]).forEach(m=>{
   const me=m.sender===currentUser;
   box.innerHTML+=`<div class="msg ${me?'me':'other'}"><b style="font-size:10px">${m.sender}</b><div>${m.text}</div></div>`;
  });
  box.scrollTop=box.scrollHeight;
 }catch(e){}
}
async function sendMessage(){
 const input=document.getElementById('chatInput');const text=input.value.trim();if(!text||!currentUser)return;
 await￼Enter
