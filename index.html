<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaybgram 6.1</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#121212;border:1px solid #222;border-radius:20px;padding:20px;width:90%;max-width:320px;text-align:center}
h1{font-family:'Syne';font-size:26px;margin:0}h1 span{color:#CCFF00}
p{font-size:11px;opacity:.6;margin:5px 0 15px}
input{width:100%;background:#1E1E1E;border:1px solid #2A2A2A;color:#fff;padding:12px;border-radius:12px;margin-top:10px;box-sizing:border-box}
button{width:100%;border:none;padding:12px;border-radius:100px;font-weight:700;margin-top:10px;cursor:pointer}
.lime{background:#CCFF00;color:#000}
.dark{background:#222;color:#fff;border:1px solid #333}
#msg{font-size:12px;margin-top:10px;color:#CCFF00;min-height:16px}
</style></head><body>

<div class="box">
<h1>KAYBGRAM<span>.</span></h1>
<p>Real Login - No Guest</p>
<input id="u" placeholder="Username e.g Kayb">
<input id="p" type="password" placeholder="Password e.g 1234">
<button class="lime" onclick="login()">Login →</button>
<button class="dark" onclick="signup()">Create New Account →</button>
<div id="msg"></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('kayb_users')||'{}');
let current = localStorage.getItem('kayb_user');
if(current){ location.href = 'app.html'; }

function signup(){
 let u=document.getElementById('u').value.trim();
 let p=document.getElementById('p').value.trim();
 let m=document.getElementById('msg');
 if(!u||!p){m.textContent='Fill username & password!';return;}
 if(users[u]){m.textContent='Exists! Tap Login';return;}
 users[u]=p;
 localStorage.setItem('kayb_users',JSON.stringify(users));
 localStorage.setItem('kayb_user',u);
 m.textContent='Created! Entering...';
 setTimeout(()=>{location.href='app.html';},600);
}
function login(){
 let u=document.getElementById('u').value.trim();
 let p=document.getElementById('p').value.trim();
 let m=document.getElementById('msg');
 if(!u||!p){m.textContent='Fill username & password!';return;}
 if(Object.keys(users).length===0){m.textContent='No account yet, tap Create!';return;}
 if(users[u]===p){
  localStorage.setItem('kayb_user',u);
  m.textContent='Welcome '+u+'! Entering...';
  setTimeout(()=>{location.href='app.html';},600);
 }else{ m.textContent='Wrong password!'; }
}
</script>
</body></html>￼Enter
