<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaybgram 5.2 FULL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#111;--card2:#1a1a1a;--border:#222;--text:#fff;--muted:#888;--lime:#CCFF00;--pink:#FF2D95}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:30;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne';font-weight:800;font-size:26px;letter-spacing:-1px}.logo span{color:var(--lime)}
.btn{border:none;padding:10px 16px;border-radius:100px;font-weight:700;cursor:pointer;font-family:'Space Grotesk'}.btn-lime{background:var(--lime);color:#000}.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.main{max-width:680px;margin:0 auto}
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;width:100%;max-width:380px;text-align:center}
.login-box input{margin-top:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;width:100%;outline:none}
.stories{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 62px;text-align:center;cursor:pointer}.ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,var(--lime),var(--pink),var(--lime));display:flex;align-items:center;justify-content:center}.ring img,.ring video{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000;background:#111}
.search-bar{margin:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:10px 16px;display:flex;gap:10px;align-items:center}.search-bar input{background:transparent;border:none;color:var(--text);outline:none;width:100%;font-family:'Space Grotesk'}
.create{background:var(--card);border:1px solid var(--border);border-radius:20px;margin:10px 14px;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tab{flex:1;padding:10px;border-radius:100px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border)}.tab.active{background:var(--lime);color:#000;border-color:var(--lime)}
.file-zone{border:1.5px dashed var(--border);border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:var(--card2);font-size:13px}
#preview,#previewVideo{width:100%;border-radius:14px;margin-top:8px;display:none;max-height:380px;object-fit:cover}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1}
input,select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:10px;outline:none;font-family:'Space Grotesk';width:100%;font-size:13px}
.music-picker{margin-top:8px;background:var(--card2);border-radius:12px;padding:10px;border:1px solid var(--border)}
.music-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}.music-chip{flex:0 0 auto;background:#000;border:1px solid var(--border);padding:6px 10px;border-radius:100px;font-size:11px;cursor:pointer;white-space:nowrap}.music-chip.active{background:var(--lime);color:#000;border-color:var(--lime)}
.card{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:8px}
.card-top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.user{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:var(--lime);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800}
.media-wrap{position:relative;background:#000}.media-wrap img,.media-wrap video{width:100%;max-height:650px;object-fit:cover;display:block}
.music-bar{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border-radius:100px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:11px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 14px;z-index:40}
.nav-item{text-align:center;cursor:pointer;opacity:0.5;font-size:11px}.nav-item.active{opacity:1}.nav-item div{font-size:22px;margin-bottom:2px}
.chat-modal{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}.chat-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--card)}.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.msg{max-width:75%;padding:10px 12px;border-radius:16px;font-size:13px}.msg.me{background:var(--lime);color:#000;align-self:flex-end;border-bottom-right-radius:4px}.msg.other{background:var(--card2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}.chat-input{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--card)}
.users-list{padding:10px 14px;max-height:200px;overflow-y:auto}.user-row{padding:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<h1 style="font-family:'Syne';font-size:34px">KAYBGRAM<span style="color:var(--lime)">.</span></h1>
<p style="opacity:0.6;font-size:12px;margin-bottom:14px">Login to chat & post — Full Version</p>
<input id="loginUser" placeholder="Username (e.g. Kayb)">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn btn-lime" style="width:100%;margin-top:12px" id="loginBtn" onclick="doLogin()">Login / Sign Up →</button>
<p id="loginStatus" style="font-size:12px;margin-top:8px;color:var(--lime)"></p>
</div>
</div>

<header><div class="logo">KAYBGRAM<span>.</span></div><div style="display:flex;gap:8px;align-items:center"><span id="currentUserLabel" style="font-size:12px;opacity:0.7"></span><button class="btn btn-ghost" style="padding:6px 10px" onclick="logout()">Logout</button></div></header>
<div class="main">
<div class="stories" id="stories"></div>
<div class="search-bar"><span>🔍</span><input id="searchInput" placeholder="Search people, vibes, music..." oninput="doSearch()"></div>
<div id="searchResults" style="display:none"></div>
<div id="mainContent">
<div class="create" id="createBox">
<div class="tabs"><div class="tab active" id="tabFeed" onclick="setMode('feed')">📸 Feed Post</div><div class="tab" id="tabStory" onclick="setMode('story')">✨ Story 24h</div></div>
<div class="file-zone" onclick="document.getElementById('fileInput').click()"><span id="zoneText">Tap to pick photo/video 📸🎥</span><input type="file" id="fileInput" accept="image/*,video/*" hidden></div>
<img id="preview"><video id="previewVideo" controls></video>
<div class="row" style="margin-top:8px"><input id="caption" placeholder="Caption... what's the vibe?"></div>
<div class="music-picker">
<p style="font-size:11px;opacity:0.6">🎵 ADD MUSIC</p>
<div class="music-list" id="musicList">
<div class="music-chip active" data-url="" data-title="No Music">🔇 No Music</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" data-title="Ayra Starr - Rush">Ayra Starr - Rush</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" data-title="Burna Boy - Last Last">Burna - Last Last</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" data-title="Rema - Calm Down">Rema - Calm Down</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" data-title="Davido - Feel">Davido - Feel</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" data-title="Asake">Asake</div>
</div>
</div>
<button class="btn btn-lime" style="width:100%;margin-top:8px" id="shareBtn" onclick="createPost()">Drop to Kaybgram →</button>
<p id="status" style="font-size:11px;text-align:center;margin-top:4px"></p>
</div>
<div class="feed" id="feed"></div>
</div>
</div>

<div class="chat-modal" id="chatModal">
<div class="chat-header"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" id="chatAvatar">G</div><div><b id="chatName">Global Chat</b><div style="font-size:11px;opacity:0.5">Everyone online</div></div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="toggleUsers()">👥 Users</button><button class="btn btn-ghost" onclick="closeChat()">✕</button></div></div>
<div class="users-list" id="usersList" style="display:none"></div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-input"><input id="chatInput" placeholder="Type message..." style="flex:1;background:var(--card2);border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:100px;outline:none" onkeypress="if(event.key==='Enter')sendMessage()"><button class="btn btn-lime" style="width:auto;padding:10px 18px" onclick="sendMessage()">Send</button></div>
</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="showHome()"><div>⌂</div>Home</div>
<div class="nav-item" onclick="openChat()"><div>💬</div>Chat</div>
<div class="nav-item" onclick="document.getElementById('fileInput').click()"><div>+</div>Create</div>
<div class="nav-item" onclick="openChat()"><div>♫</div>Music</div>
<div class="nav-item" onclick="logout()"><div>◍</div>You</div>
</div>

<script>
const SUPABASE_URL="https://qpwmlpisveearglmagvt.supabase.co";
const SUPABASE_KEY="sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=localStorage.getItem('kayb_user')||null;
let fileData="",fileType="image",mode="feed",selectedMusicUrl="",selectedMusicTitle="",allPosts=[],chatTarget="global";

function checkLogin(){if(currentUser){document.getElementById('loginScreen').style.display='none';document.getElementById('currentUserLabel').textContent='@'+currentUser;}else{document.getElementById('loginScreen').style.display='flex';}}
checkLogin();

// FIXED LOGIN - ALWAYS WORKS, NO.single() bug!
async function doLogin(){
 const u=document.getElementById('loginUser').value.trim();
 const p=document.getElementById('loginPass').value.trim();
 const s=document.getElementById('loginStatus');
 const btn=document.getElementById('loginBtn');
 if(!u||!p){s.textContent="Enter username & password!";return;}
 btn.textContent="Loading...";btn.disabled=true;
 try{
  currentUser=u;localStorage.setItem('kayb_user',u);
  // Save in background, don't block
  supabaseClient.from('profiles').upsert([{username:u,password:p}],{onConflict:'username'}).then();
  s.textContent="Welcome "+u+"! 🔥";
  setTimeout(()=>{checkLogin();loadAll();btn.textContent="Login / Sign Up →";btn.disabled=false;},600);
 }catch(e){s.textContent="Error: "+e.message;btn.textContent="Login / Sign Up →";btn.disabled=false;}
}
function logout(){localStorage.removeItem('kayb_user');currentUser=null;location.reload();}

document.querySelectorAll('.music-chip').forEach(c=>{
 c.onclick=()=>{document.querySelectorAll('.music-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');selectedMusicUrl=c.dataset.url;selectedMusicTitle=c.dataset.title;}
});
function setMode(m){mode=m;document.getElementById('tabFeed').className=m==='feed'?'tab active':'tab';document.getElementById('tabStory').className=m==='story'?'tab active':'tab';document.getElementById('shareBtn').textContent=m==='story'?'Add to Story ✨':'Drop to Kaybgram →';}
document.getElementById('fileInput').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;fileType=file.type.startsWith('video')?'video':'image';
 const reader=new FileReader();reader.onload=ev=>{
  if(fileType==='image'){
   const img=new Image();img.onload=()=>{
    const canvas=document.createElement('canvas');const max=720;let w=img.width,h=img.height;if(w>max){h*=max/w;w=max}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
    fileData=canvas.toDataURL('image/jpeg',0.68);document.getElementById('preview').src=fileData;document.getElementById('preview').style.display='block';document.getElementById('previewVideo').style.display='none';
   };img.src=ev.target.result;
  }else{fileData=ev.target.result;document.getElementById('previewVideo').src=fileData;document.getElementById('previewVideo').style.display='block';document.getElementById('preview').style.display='none';}
  document.getElementById('zoneText').textContent=file.name;
 };reader.readAsDataURL(file);
});
async function loadAll(){
 const {data:posts}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false});
 const {data:storiesData}=await supabaseClient.from('stories').select('*').order('created_at',{ascending:false});
 allPosts=posts||[];
 const now=Date.now();const valid=(storiesData||[]).filter(s=>(now-new Date(s.created_at).getTime())<86400000);
 document.getElementById('stories').innerHTML=`<div class="story" onclick="document.getElementById('fileInput').click();setMode('story')"><div class="ring" style="background:#222"><span>+</span></div><b>Add Story</b></div>`+valid.map(s=>`<div class="story" onclick="viewStory('${s.image_url}')"><div class="ring"><img src="${s.image_url}"></div><b>${s.username}</b></div>`).join('');
 const feed=document.getElementById('feed');feed.innerHTML="";
 (posts||[]).forEach(p=>{
  const isV=p.image_url?.startsWith('data:video');
  const media=isV?`<video src="${p.image_url}" controls playsinline></video>`:`<img src="${p.image_url}">`;
  const music=p.music_url?`<div class="music-bar"><span>🎵 ${p.music_title}</span><audio controls src="${p.music_url}" style="height:24px"></audio></div>`:"";
  feed.innerHTML+=`<div class="card"><div class="card-top"><div class="user"><div class="avatar">${(p.username||'K')[0].toUpperCase()}</div><div><b>${p.username}</b><div style="font-size:11px;opacity:0.5">${new Date(p.created_at).toLocaleString()}</div></div></div><span style="opacity:0.4;font-size:11px;cursor:pointer" onclick="deletePost(${p.id})">Delete ✕</span></div><div class="media-wrap">${media}${music}</div><div style="padding:8px 14px"><div style="display:flex;gap:12px"><span style="cursor:pointer" onclick="likePost(${p.id},${p.likes||0})">❤️ ${p.likes||0}</span><span style="cursor:pointer" onclick="openChat()">💬 Chat</span></div><div style="font-size:13px;margin-top:4px"><b>${p.username}</b> ${p.caption||''}</div></div></div>`;
 });
}
async function createPost(){
 if(!currentUser){alert('Login first!');return;}
 const caption=document.getElementById('caption').value;const btn=document.getElementById('shareBtn');const status=document.getElementById('status');
 if(!fileData){status.textContent="Pick photo first!";return;}
 btn.textContent="Posting...";btn.disabled=true;
 const table=mode==='story'?'stories':'posts';
 const {error}=await supabaseClient.from(table).insert([{caption,image_url:fileData,username:currentUser,type:fileType,likes:0,music_url:selectedMusicUrl,music_title:selectedMusicTitle}]);
 if(error){status.textContent=error.message;btn.disabled=false;}
 else{status.textContent=mode==='story'?'Story added! 🔥':'Dropped! 🔥';fileData="";document.getElementById('preview').style.display='none';document.getElementById('previewVideo').style.display='none';document.getElementById('caption').value="";document.getElementById('zoneText').textContent="Tap to pick photo/video 📸🎥";btn.disabled=false;setMode('feed');loadAll();}
}
async function likePost(id,c){await supabaseClient.from('posts').update({likes:c+1}).eq('id',id);loadAll();}
async function deletePost(id){if(!confirm('Delete?'))return;await supabaseClient.from('posts').delete().eq('id',id);loadAll();}
function doSearch(){
 const q=document.getElementById('searchInput').value.toLowerCase();const res=document.getElementById('searchResults');const main=document.getElementById('mainContent');
 if(!q){res.style.display='none';main.style.display='block';return;}
 main.style.display='none';res.style.display='block';
 const filtered=allPosts.filter(p=>p.username?.toLowerCase().includes(q)||p.caption?.toLowerCase().includes(q)||p.music_title?.toLowerCase().includes(q));
 res.innerHTML=`<h3 style="margin:10px 0">Results for "${q}" - ${filtered.length}</h3>`+filtered.map(p=>`<div style="padding:10px;background:#111;border:1px solid #222;border-radius:12px;margin-bottom:6px"><b>${p.username}</b> - ${p.caption||''} ${p.music_title?'🎵 '+p.music_title:''}</div>`).
