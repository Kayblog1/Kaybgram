<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=devi<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaybgram 3.0 — New Wave</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#111;--card2:#0d0d0d;--border:#1e1e1e;--border2:#2a2a2a;--text:#fff;--muted:#888;--lime:#CCFF00}
.light{--bg:#f5f5f0;--card:#fff;--card2:#f0f0ea;--border:#e5e5e0;--border2:#d5d5d0;--text:#0a0a0a;--muted:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui;transition:0.3s}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne';font-weight:800;font-size:24px;letter-spacing:-1px}
.logo span{color:var(--lime)}
.btn{border:none;padding:10px 18px;border-radius:100px;font-weight:700;font-family:'Space Grotesk';cursor:pointer}
.btn-lime{background:var(--lime);color:#000}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.main{max-width:680px;margin:0 auto;padding:0 12px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 64px;text-align:center;cursor:pointer}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--lime), #00ff88, var(--lime));display:flex;align-items:center;justify-content:center}
.story-ring img,.story-ring video{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--card);border:2px solid var(--bg)}
.story b{font-size:11px;margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:64px}
.story.add.story-ring{background:var(--border2);border:1.5px dashed var(--muted)}
.create{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:16px;margin:10px 0;position:relative}
.file-zone{border:1.5px dashed var(--border2);border-radius:16px;padding:16px;text-align:center;cursor:pointer;background:var(--card2)}
#preview,#previewVideo{width:100%;border-radius:16px;margin-top:10px;display:none;max-height:380px;object-fit:cover}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1}
input,textarea{background:var(--card2);border:1px solid var(--border2);color:var(--text);padding:12px 14px;border-radius:12px;font-family:'Space Grotesk';outline:none;width:100%}
.feed{padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;margin-bottom:14px}
.card-top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.user{display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--lime);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800}
.card img.feed-media,.card video.feed-media{width:100%;max-height:600px;object-fit:cover;background:#000;display:block}
.card-bottom{padding:10px 14px}
.act{font-size:20px;cursor:pointer}
.likes{font-weight:700;font-size:13px}
.caption{font-size:13px;opacity:0.9;margin-top:2px}
.profile-modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.profile-box{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:24px;width:100%;max-width:400px;text-align:center}
.stat{display:flex;justify-content:space-around;margin:16px 0}
.stat b{font-size:22px;font-family:'Syne';display:block}
.stat span{font-size:11px;opacity:0.6}
</style>
</head>
<body>
<header>
<div class="logo">KAYBGRAM<span>.</span></div>
<div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="toggleTheme()" id="themeBtn">☀️</button><button class="btn btn-ghost" onclick="openProfile()">👤</button><button class="btn btn-lime" onclick="document.getElementById('create').scrollIntoView({behavior:'smooth'})">+ Drop</button></div>
</header>
<div class="main">
<div class="stories" id="stories"></div>

<div id="create" class="create">
<div style="display:flex;gap:8px;margin-bottom:10px">
<button class="btn btn-lime" style="flex:1;font-size:12px" onclick="setMode('feed')">📸 Feed Post</button>
<button class="btn btn-ghost" style="flex:1;font-size:12px" id="storyModeBtn" onclick="setMode('story')">✨ Story (24h)</button>
</div>
<div class="file-zone" onclick="document.getElementById('fileInput').click()"><span id="zoneText">Tap to pick photo/video 📸</span><input type="file" id="fileInput" accept="image/*,video/*" hidden></div>
<img id="preview"><video id="previewVideo" controls></video>
<div class="row"><input id="username" placeholder="Name"><input id="caption" placeholder="Vibe..."></div>
<button class="btn btn-lime" style="width:100%;margin-top:10px" id="shareBtn" onclick="createPost()">Drop to Kaybgram →</button>
<p id="status" style="font-size:12px;text-align:center;margin-top:6px"></p>
</div>

<div id="feed" class="feed"></div>
</div>

<div class="profile-modal" id="profileModal" onclick="if(event.target==this)closeProfile()">
<div class="profile-box">
<div class="avatar" style="width:64px;height:64px;font-size:28px;margin:0 auto" id="pAvatar">K</div>
<h2 id="pName" style="font-family:'Syne';margin-top:10px">Kayb</h2>
<p style="opacity:0.6;font-size:12px" id="pHandle">@kayb • Edo, NG</p>
<div class="stat"><div><b id="pPosts">0</b><span>POSTS</span></div><div><b id="pLikes">0</b><span>LIKES</span></div><div><b id="pStories">0</b><span>STORIES</span></div></div>
<button class="btn btn-ghost" style="width:100%" onclick="closeProfile()">Close</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://qpwmlpisveearglmagvt.supabase.co";
const SUPABASE_KEY = "sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let fileData="", fileType="image", mode="feed";
const usernameInput=document.getElementById('username');
usernameInput.value=localStorage.getItem('kayb_name')||'Kayb';
usernameInput.addEventListener('input',()=>localStorage.setItem('kayb_name',usernameInput.value));
let theme=localStorage.getItem('kayb_theme')||'dark';
function applyTheme(){document.body.classList.toggle('light',theme==='light');document.getElementById('themeBtn').textContent=theme==='light'?'🌙':'☀️';}
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('kayb_theme',theme);applyTheme();}applyTheme();
function setMode(m){mode=m;document.getElementById('storyModeBtn').className=m==='story'?'btn btn-lime':'btn btn-ghost';document.getElementById('shareBtn').textContent=m==='story'?'Add to Story →':'Drop to Kaybgram →';document.getElementById('shareBtn').style.background=m==='story'?'#fff':'var(--lime)'}
document.getElementById('fileInput').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;fileType=file.type.startsWith('video')?'video':'image';
 const reader=new FileReader();
 reader.onload=ev=>{
  if(fileType==='image'){
   const img=new Image();img.onload=()=>{
    const canvas=document.createElement('canvas');const max=700;let w=img.width,h=img.height;if(w>h){if(w>max){h*=max/w;w=max}}else{if(h>max){w*=max/h;h=max}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
    fileData=canvas.toDataURL('image/jpeg',0.65);
    document.getElementById('preview').src=fileData;document.getElementById('preview').style.display='block';document.getElementById('previewVideo').style.display='none';
   };img.src=ev.target.result;
  }else{if(file.size>8*1024*1024){alert('Video too big <8MB');return;}fileData=ev.target.result;document.getElementById('previewVideo').src=fileData;document.getElementById('previewVideo').style.display='block';document.getElementById('preview').style.display='none';}
  document.getElementById('zoneText').textContent=file.name;
 };
 reader.readAsDataURL(file);
});
async function loadAll(){
 const {data:posts}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false});
 const {data:storiesData}=await supabaseClient.from('stories').select('*').order('created_at',{ascending:false});
 // filter stories <24h
 const now=Date.now();
 const validStories=(storiesData||[]).filter(s=> (now - new Date(s.created_at).getTime()) < 24*60*60*1000);
 const expired=(storiesData||[]).filter(s=> (now - new Date(s.created_at).getTime()) >= 24*60*60*1000);
 if(expired.length>0){expired.forEach(s=>supabaseClient.from('stories').delete().eq('id',s.id).then())}
 // render stories
 const storiesEl=document.getElementById('stories');
 let html=`<div class="story add" onclick="document.getElementById('fileInput').click();setMode('story')"><div class="story-ring"><span style="font-size:24px">+</span></div><b>Add Story</b></div>`;
 validStories.forEach(s=>{
  const isV=s.type==='video'||s.image_url.startsWith('data:video');
  html+=`<div class="story" onclick="viewStory('${s.image_url}','${s.type}')"><div class="story-ring">${isV?`<video src="${s.image_url}"></video>`:`<img src="${s.image_url}">`}</div><b>${s.username}</b></div>`;
 });
 storiesEl.innerHTML=html;
 // feed
 const feed=document.getElementById('feed');feed.innerHTML="";
 (posts||[]).forEach(p=>{
  const isVideo=p.type==='video'||(p.image_url&&p.image_url.startsWith('data:video'));
  const media=isVideo?`<video src="${p.image_url}" controls playsinline class="feed-media"></video>`:`<img src="${p.image_url}" class="feed-media">`;
  feed.innerHTML+=`<div class="card"><div class="card-top"><div class="user"><div class="avatar">${(p.username||'K')[0].toUpperCase()}</div><div><b>${p.username}</b><div style="font-size:11px;opacity:0.5">${new Date(p.created_at).toLocaleTimeString()}</div></div></div><span style="font-size:11px;opacity:0.4;cursor:pointer" onclick="deletePost(${p.id},'posts')">Delete ✕</span></div>${media}<div class="card-bottom"><div style="display:flex;gap:12px;margin-bottom:6px"><span class="act" onclick="likePost(${p.id},${p.likes||0})">❤️</span><span class="act">💬</span><span class="act">↗️</span></div><div class="likes">${p.likes||0} likes</div><div class="caption"><b>${p.username}</b> ${p.caption||''}</div></div></div>`;
 });
 // profile stats
 document.getElementById('pPosts').textContent=posts?posts.length:0;
 document.getElementById('pLikes').textContent=posts?posts.reduce((a,b)=>a+(b.likes||0),0):0;
 document.getElementById('pStories').textContent=validStories.length;
}
async function createPost(){
 const caption=document.getElementById('caption').value;const username=document.getElementById('username').value||'Kayb';const status=document.getElementById('status');const btn=document.getElementById('shareBtn');
 if(!fileData){status.textContent="Pick file first!";return;}
 btn.textContent="Posting...";btn.disabled=true;
 const table=mode==='story'?'stories':'posts';
 const {error}=await supabaseClient.from(table).insert([{caption,image_url:fileData,username,type:fileType,likes:0}]);
 if(error){status.textContent="Error: "+error.message;btn.disabled=false;btn.textContent=mode==='story'?'Add to Story →':'Drop to Kaybgram →';}
 else{status.textContent=mode==='story'?'Story added! ✨':'Dropped! 🔥';fileData="";document.getElementById('preview').style.display='none';document.getElementById('previewVideo').style.display='none';document.getElementById('caption').value="";document.getElementById('zoneText').textContent="Tap to pick photo/video 📸";btn.disabled=false;setMode('feed');loadAll();}
}
async function likePost(id,c){await supabaseClient.from('posts').update({likes:c+1}).eq('id',id);loadAll();}
async function deletePost(id,table){if(!confirm('Delete?'))return;await supabaseClient.from(table).delete().eq('id',id);loadAll();}
function openProfile(){document.getElementById('pName').textContent=usernameInput.value;document.getElementById('pAvatar').textContent=(usernameInput.value[0]||'K').toUpperCase();document.getElementById('profileModal').style.display='flex';}
function closeProfile(){document.getElementById('profileModal').style.display='none';}
function viewStory(url,type){const w=window.open();w.document.write(type==='video'?`<video src="${url}" controls autoplay style="width:100%;height:100vh;object-fit:contain;background:#000"></video>`:`<img src="${url}" style="width:100%;height:100vh;object-fit:contain;background:#000">`);}
loadAll();setInterval(loadAll,10000);
</script>
</body>
</html>￼Enter
