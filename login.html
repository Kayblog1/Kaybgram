<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Login - Kaybgram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111111;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 575px;
      padding: 40px;
      background: #1d1d1d;
      border: 2px solid #b99543;
      border-radius: 28px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 10px 0 20px;
      text-align: center;
      color: #f2c14e;
      font-size: 42px;
    }

    .subtitle {
      color: #dddddd;
      text-align: center;
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    input {
      display: block;
      width: 100%;
      padding: 18px;
      margin-bottom: 22px;
      border: 2px solid #484848;
      border-radius: 15px;
      background: #292929;
      color: #ffffff;
      font-size: 18px;
      outline: none;
    }

    input::placeholder {
      color: #999999;
      opacity: 1;
    }

    input:focus {
      border-color: #b99543;
    }

    button {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #f2c14e;
      color: #171717;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      margin-top: 16px;
      background: transparent;
      color: #f2c14e;
      border: 2px solid #484848;
    }

    .signup {
      text-align: center;
      margin-top: 28px;
      color: #dddddd;
      font-size: 17px;
      line-height: 1.6;
    }

    a {
      color: #f2c14e;
      text-decoration: underline;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .container {
        padding: 28px 22px;
        border-radius: 24px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }

      input,
      button {
        padding: 16px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Kaybgram</h1>

    <p class="subtitle">Log in to your account</p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <button type="button" class="forgot" id="forgotButton">
      Forgot Password?
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="signup">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const forgotButton = document.getElementById("forgotButton");
    const message = document.getElementById("message");

    const RESET_URL =
      "https://kayblog1.github.io/Kaybgram/reset-password.html";

    // LOGIN
    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!window.supabaseClient) {
        message.textContent =
          "Connection error. Please try again later.";
        return;
      }

      loginButton.disabled = true;
      message.textContent = "Logging in...";

      try {
        const { error } =
          await window.supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent =
            "Login failed: " + error.message;
          return;
        }

        message.textContent =
          "Login successful! Opening Kaybgram...";

        window.location.href = "app.html";

      } catch (error) {
        message.textContent =
          "Something went wrong. Please try again.";
      } finally {
        loginButton.disabled = false;
      }
    });

    // FORGOT PASSWORD
    forgotButton.addEventListener("click", async function() {
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent =
          "Enter your email address above first.";
        emailInput.focus();
        return;
      }

      if (!window.supabaseClient) {
        message.textContent =
          "Connection error. Please try again later.";
        return;
      }

      forgotButton.disabled = true;
      message.textContent = "Sending password-reset email...";

      try {
        const { error } =
          await window.supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo: RESET_URL
            }
          );

        if (error) {
          message.textContent =
            "Unable to send reset email: " + error.message;
          return;
        }

        message.textContent =
          "If an account exists for this email, a password-reset link will be sent. Check your inbox and spam folder.";

      } catch (error) {
        message.textContent =
          "Something went wrong. Please try again.";
      } finally {
        forgotButton.disabled = false;
      }
    });
  </script>

</body>
  </html>
