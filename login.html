<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Login - Kaybgram</title>  <style>
    :root {
      --background: #111111;
      --surface: #1d1d1d;
      --text: #ffffff;
      --muted: #bdbdbd;
      --gold: #e7b84b;
      --border: #393939;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }

    h1 {
      margin-top: 0;
      color: var(--gold);
      text-align: center;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--background);
      color: var(--text);
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--gold);
      color: #111111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      color: var(--gold);
    }

    #message {
      overflow-wrap: anywhere;
    }
  </style></head><body>
  <main class="login-card">
    <h1>Kaybgram</h1>
    <p>Welcome back! Log in to your account.</p><form id="loginForm">
  <label for="email">Email address</label>
  <input
    id="email"
    type="email"
    autocomplete="email"
    required
  >

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    required
  >

  <button type="submit">Log in</button>
  <p id="message" role="status"></p>
</form>

<p>Don't have an account?
  <a href="signup.html">Join Kaybgram</a>
</p>

<p><a href="index.html">Back to home</a></p>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="supabase.js"></script>  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!window.supabaseClient) {
        message.textContent =
          "Connection setup is incomplete. Please try again later.";
        return;
      }

      const { data, error } =
        await window.supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Login successful! Opening Kaybgram...";

      window.location.href = "app.html";
    });
  </script></body>
</html>
