<!<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaybgram - Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
header{padding:12px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 12px;border-radius:16px;font-size:13px}
.me{background:#CCFF00;color:#000;align-self:flex-end}
.other{background:#1a1a1a;border:1px solid #222;align-self:flex-start}
.input{padding:10px;display:flex;gap:8px;border-top:1px solid #222;background:#111}
.input input{flex:1;background:#1a1a1a;border:1px solid #222;color:#fff;padding:10px 14px;border-radius:100px;outline:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px}
.nav a{color:#fff;text-decoration:none;font-size:11px;text-align:center;opacity:.5}.nav a.active{opacity:1;color:#CCFF00}
</style>
</head>
<body>
<header><b style="font-family:'Syne'">CHAT 💬</b><a href="app.html" style="color:#fff;text-decoration:none;border:1px solid #333;padding:6px 12px;border-radius:100px;font-size:11px">Back to Feed</a></header>

<div class="msgs" id="msgs" style="padding-bottom:80px"></div>

<div style="position:fixed;bottom:55px;left:0;right:0" class="input">
<input id="txt" placeholder="Type message...">
<button onclick="send()" style="background:#CCFF00;border:none;padding:10px 18px;border-radius:100px;font-weight:700">Send</button>
</div>

<div class="nav">
<a href="app.html"><div>⌂</div>Feed</a>
<a href="chat.html" class="active"><div>💬</div>Chat</a>
<a href="stories.html"><div>✨</div>Story</a>
<a href="music.html"><div>🎵</div>Music</a>
</div>

<script>
const supa=supabase.createClient("https://qpwmlpisveearglmagvt.supabase.co","sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB");
let user=localStorage.getItem('kayb_user'); if(!user) location.href='index.html';
async function load(){ const {data}=await supa.from('messages').select('*').order('created_at',{ascending:true}).limit(100); document.getElementById('msgs').innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender===user?'me':'other'}"><b style="font-size:10px;opacity:.6">${m.sender}</b><div>${m.text}</div></div>`).join(''); document.getElementById('msgs').scrollTop=99999; }
async function send(){ const t=document.getElementById('txt').value.trim(); if(!t) return; document.getElementById('txt').value=''; await supa.from('messages').insert([{sender:user,receiver:'global',text:t}]); load(); }
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter') send();});
load(); setInterval(load,3000);
</script>
</body>
</html>￼Enter
