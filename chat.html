<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat — Kaybgram</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;padding-bottom:140px}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.3}
.me{background:var(--lime);color:#000;align-self:flex-end;border-bottom-right-radius:6px}
.other{background:var(--card2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:6px}
.input-bar{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:620px;padding:0 12px;display:flex;gap:8px}
</style>
</head>
<body style="height:100vh;display:flex;flex-direction:column">
<header><div class="container" style="display:flex;justify-content:space-between;width:100%"><div class="logo">CHAT<span>.</span></div><div class="badge">Global • Online</div></div></header>
<div class="container" style="flex:1;display:flex;flex-direction:column;width:100%"><div class="msgs" id="msgs"></div></div>
<div class="input-bar"><input id="txt" class="input" style="margin-top:0" placeholder="Type a message..."><button onclick="send()" class="btn btn-lime" style="width:auto;margin-top:0;padding:12px 20px">Send</button></div>
<div class="nav"><a href="app.html"><div>⌂</div>Feed</a><a href="chat.html" class="active"><div>💬</div>Chat</a><a href="stories.html"><div>✦</div>Story</a><a href="music.html"><div>♫</div>Music</a></div>
<script>
const supa=supabase.createClient("https://qpwmlpisveearglmagvt.supabase.co","sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB");
let user=localStorage.getItem('kayb_user'); if(!user) location.href='index.html';
async function load(){ const {data}=await supa.from('messages').select('*').order('created_at',{ascending:true}).limit(100); document.getElementById('msgs').innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender===user?'me':'other'}"><div style="font-size:10px;opacity:.6;margin-bottom:2px">${m.sender}</div>${m.text}</div>`).join(''); document.getElementById('msgs').scrollTop=99999; }
async function send(){ const t=document.getElementById('txt').value.trim(); if(!t) return; document.getElementById('txt').value=''; await supa.from('messages').insert([{sender:user,receiver:'global',text:t}]); load(); }
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter') send()}); load(); setInterval(load,3000);
</script>
</body>
                                                                                                            </html>
