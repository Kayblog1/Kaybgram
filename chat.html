<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Kaybgram Chat</title>

<style>
:root {
  --bg:#101010;
  --panel:#191919;
  --panel2:#242424;
  --text:#f8f5ee;
  --muted:#aaa49a;
  --gold:#d8b56d;
  --border:#35312a;
}
body.light {
  --bg:#f6f1e8;
  --panel:#fffdf8;
  --panel2:#eee5d7;
  --text:#252019;
  --muted:#756d61;
  --gold:#a77a2d;
  --border:#e1d5c2;
}
* {box-sizing:border-box}
html,body {
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}
body {
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input {font:inherit}
button {cursor:pointer}
a {color:inherit;text-decoration:none}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}
.logo {
  color:var(--gold);
  font:bold 25px Georgia,serif;
}
.theme {
  background:var(--panel2);
  color:var(--gold);
  border:1px solid var(--border);
  border-radius:50%;
  width:38px;
  height:38px;
}
.container {
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  max-width:1050px;
  margin:auto;
  padding:20px;
  gap:18px;
}
.box {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  min-width:0;
}
h2 {font:22px Georgia,serif}
.gold {color:var(--gold)}
.muted {color:var(--muted);font-size:13px}
.menu a {
  display:block;
  padding:13px 8px;
  border-radius:8px;
  color:var(--muted);
}
.menu a:hover {background:var(--panel2);color:var(--gold)}
.chatlist {padding:0}
.person {
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 8px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.person:hover,.person.active {background:var(--panel2)}
.avatar {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  border:2px solid var(--gold);
  color:var(--gold);
  background:var(--panel2);
  font-weight:bold;
}
.person-info {min-width:0}
.person-info strong {display:block}
.person-info small {color:var(--muted)}
.chatarea {
  display:flex;
  flex-direction:column;
  min-height:420px;
}
.chathead {
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:13px;
  border-bottom:1px solid var(--border);
}
.messages {
  display:flex;
  flex:1;
  flex-direction:column;
  gap:12px;
  padding:18px 0;
}
.bubble {
  max-width:85%;
  padding:11px 13px;
  border-radius:13px;
  background:var(--panel2);
  line-height:1.5;
  overflow-wrap:anywhere;
}
.bubble.mine {
  align-self:flex-end;
  background:var(--gold);
  color:#17130c;
}
.composer {
  display:flex;
  gap:8px;
  border-top:1px solid var(--border);
  padding-top:13px;
}
.composer input {
  width:100%;
  min-width:0;
  padding:12px;
  border:1px solid var(--border);
  border-radius:22px;
  background:var(--panel2);
  color:var(--text);
}
.send {
  border:0;
  border-radius:22px;
  padding:0 17px;
  background:var(--gold);
  color:#17130c;
  font-weight:bold;
}
.back {display:none}
.bottomnav {display:none}

@media(max-width:650px) {
  header {padding:11px}
  .logo {font-size:22px}
  .container {
    display:flex;
    flex-direction:column;
    padding:10px;
    gap:10px;
  }
  .menu {display:none}
  .chatarea {min-height:55vh}
  .back {
    display:inline-block;
    background:var(--panel2);
    color:var(--gold);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
  }
  .bottomnav {
    display:flex;
    justify-content:space-around;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:10px 2px;
    background:var(--panel);
    border-top:1px solid var(--border);
  }
  .bottomnav a {
    text-align:center;
    font-size:11px;
    color:var(--muted);
  }
  .bottomnav span {
    display:block;
    font-size:19px;
    margin-bottom:3px;
  }
  body {padding-bottom:55px}
}
</style>
</head>

  <strong>Messages</strong>
  <button class="theme" id="theme">☼</button>
</header>
