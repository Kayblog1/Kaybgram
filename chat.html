<body>

<header class="site-header">
  <a class="brand" href="index.html">
    Kaybgram<span class="brand-sparkle">✦</span>
  </a>

  <button
    class="theme-button"
    id="themeButton"
    type="button"
    aria-label="Switch colour theme"
  >☾</button>
</header>

<div class="page">

  <aside class="side-menu">
    <h2>Menu ✦</h2>

    <nav class="side-links" aria-label="Main menu">
      <a href="index.html">⌂ Home</a>
      <a href="profile.html">♙ Profile</a>
      <a href="app.html">✦ Explore</a>
      <a href="stories.html">◉ Stories</a>
      <a class="active" href="chat.html">✉ Messages</a>
      <a href="music.html">♫ Music</a>
    </nav>
  </aside>

  <main class="main-content">

    <section class="contacts-panel" aria-label="Conversation contacts">
      <h1 class="section-title">Messages ✦</h1>

      <div class="contact-list">

        <button
          class="contact active"
          data-name="Amara"
          data-letter="A"
          type="button"
          aria-pressed="true"
        >
          <span class="avatar">A</span>
          <span class="contact-name">Amara</span>
        </button>

        <button
          class="contact"
          data-name="David"
          data-letter="D"
          type="button"
          aria-pressed="false"
        >
          <span class="avatar">D</span>
          <span class="contact-name">David</span>
        </button>

        <button
          class="contact"
          data-name="Zina"
          data-letter="Z"
          type="button"
          aria-pressed="false"
        >
          <span class="avatar">Z</span>
          <span class="contact-name">Zina</span>
        </button>

      </div>
    </section>

    <section class="chat-panel" aria-label="Chat conversation">

      <div class="chat-header">
        <div class="avatar" id="chatAvatar">A</div>

        <div class="chat-person">
          <strong id="chatName">Amara</strong>
          <p>Kaybgram conversation</p>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite">
        <p class="empty-state">
          ✦<br><br>
          Say hello!<br>
          Type a message below to get started.
        </p>
      </div>

      <form class="message-form" id="messageForm">
        <input
          class="message-input"
          id="messageInput"
          type="text"
          placeholder="Write a message..."
          autocomplete="off"
          aria-label="Write a message"
        >

        <button class="send-button" type="submit">
          Send ➤
        </button>
      </form>

    </section>

<script>
(function () {
  const themeButton = document.getElementById('themeButton');
  const messageForm = document.getElementById('messageForm');
  const messageInput = document.getElementById('messageInput');
  const messages = document.getElementById('messages');
  const chatName = document.getElementById('chatName');
  const chatAvatar = document.getElementById('chatAvatar');

  const contacts = Array.from(
    document.querySelectorAll('.contact')
  );

  // Restore the saved Kaybgram theme.
  const savedTheme = localStorage.getItem('kaybgram-theme');

  if (savedTheme === 'dark') {
    document.body.classList.add('dark');
  }

  function updateThemeButton() {
    const darkMode =
      document.body.classList.contains('dark');

    themeButton.textContent = darkMode ? '☀' : '☾';

    themeButton.setAttribute(
      'aria-label',
      darkMode
        ? 'Switch to light theme'
        : 'Switch to dark theme'
    );
  }

  updateThemeButton();

  themeButton.addEventListener('click', function () {
    document.body.classList.toggle('dark');

    localStorage.setItem(
      'kaybgram-theme',
      document.body.classList.contains('dark')
        ? 'dark'
        : 'light'
    );

    updateThemeButton();
  });

  // Messages are temporary until a backend/database is connected.
  const conversations = {
    Amara: [],
    David: [],
    Zina: []
  };

  let currentContact = 'Amara';

  function renderMessages() {
    messages.replaceChildren();

    const conversation = conversations[currentContact];

    if (conversation.length === 0) {
      const empty = document.createElement('p');

      empty.className = 'empty-state';
      empty.textContent =
        'Say hello to ' + currentContact + '!';

      messages.appendChild(empty);
      return;
    }

    conversation.forEach(function (message) {
      const bubble = document.createElement('div');

      bubble.className = 'message-bubble outgoing';
      bubble.textContent = message;

      messages.appendChild(bubble);
    });

    messages.scrollTop = messages.scrollHeight;
  }

  // Switch between contacts.
  contacts.forEach(function (contact) {
    contact.addEventListener('click', function () {
      contacts.forEach(function (item) {
        item.classList.remove('active');

        item.setAttribute(
          'aria-pressed',
          'false'
        );
      });

      contact.classList.add('active');

      contact.setAttribute(
        'aria-pressed',
        'true'
      );

      currentContact = contact.dataset.name;

      chatName.textContent = currentContact;

      chatAvatar.textContent =
        contact.dataset.letter;

      renderMessages();
    });
  });

  // Handle message submission.
  messageForm.addEventListener('submit', function (event) {
    event.preventDefault();

    const text = messageInput.value.trim();

    if (!text) {
      messageInput.focus();
      return;
    }

    conversations[currentContact].push(text);

    messageInput.value = '';

    renderMessages();

    messageInput.focus();
  });
})();
</script>
