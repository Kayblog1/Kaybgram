<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — Kaybgram</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#09090b;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}header{position:sticky;top:0;background:rgba(9,9,11,.95);backdrop-filter:blur(20px);border-bottom:1px solid #232326;padding:14px 16px;display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.logo span{color:#CCFF00}.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;padding-bottom:140px;max-width:600px;margin:0 auto;width:100%}.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:13px}.me{background:#CCFF00;color:#000;align-self:flex-end;border-bottom-right-radius:6px}.other{background:#121214;border:1px solid #232326;align-self:flex-start;border-bottom-left-radius:6px}.input-bar{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:600px;padding:0 12px;display:flex;gap:8px}.input{flex:1;background:#1c1c1f;border:1px solid #232326;color:#fff;padding:12px;border-radius:100px;outline:none}.btn{background:#CCFF00;color:#000;border:none;border-radius:100px;padding:12px 20px;font-weight:800}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#18181b;border:1px solid #2a2a2e;border-radius:100px;padding:6px;display:flex;gap:4px}.nav a{color:#a1a1aa;text-decoration:none;font-size:11px;font-weight:700;padding:9px 18px;border-radius:100px;text-align:center}.nav a.active{background:#fff;color:#000}</style></head><body><header><div class="logo">CHAT<span>.</span></div><div style="background:#1c1c1f;border:1px solid #232326;padding:6px 12px;border-radius:100px;font-size:11px;color:#a1a1aa">Global • Online</div></header><div class="msgs" id="msgs"></div><div class="input-bar"><input id="txt" class="input" placeholder="Type a message..."><button onclick="send()" class="btn">Send</button></div><div class="nav"><a href="app.html">⌂<br>Feed</a><a href="chat.html" class="active">💬<br>Chat</a><a href="stories.html">✦<br>Story</a><a href="music.html">♫<br>Music</a></div><script>const supa=supabase.createClient("https://qpwmlpisveearglmagvt.supabase.co","sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB");let user=localStorage.getItem('kayb_user');if(!user)location.href='index.html';async function load(){const {data}=await supa.from('messages').select('*').order('created_at',{ascending:true}).limit(100);document.getElementById('msgs').innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender===user?'me':'other'}"><div style="font-size:10px;opacity:.6;margin-bottom:2px">${m.sender}</div>${m.text}</div>`).join('');document.getElementById('msgs').scrollTop=99999;}async function send(){const t=document.getElementById('txt').value.trim();if(!t)return;document.getElementById('txt').value='';await supa.from('messages').insert([{sender:user,receiver:'global',text:t}]);load();}document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});load();setInterval(load,3000);</script></body></html>￼Enter
