<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaybgram Chat</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}:root {
--gold: #d4af37;
--background: #080808;
--panel: #151515;
--border: #333333;
--text: #ffffff;
--muted: #aaaaaa;
}

body {
font-family: Arial, sans-serif;
background: var(--background);
color: var(--text);
min-height: 100vh;
}

body.light {
--background: #f4f4f4;
--panel: #ffffff;
--border: #dddddd;
--text: #171717;
--muted: #666666;
}

a {
color: inherit;
text-decoration: none;
}

button, input {
font: inherit;
}

button {
cursor: pointer;
}

.gold {
color: var(--gold);
}

.muted {
color: var(--muted);
}
</style>

</head>
<body>￼Enter
  <header style="
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 5%;
  border-bottom:1px solid var(--border);
  background:var(--panel);
">
  <a href="index.html" style="
    font-size:24px;
    font-weight:bold;
    color:var(--gold);
  ">Kaybgram</a><button id="themeButton" type="button" style="
background:transparent;
border:1px solid var(--gold);
color:var(--gold);
padding:8px 12px;
border-radius:8px;
">☼</button>

</header><div class="page" style="
  display:grid;
  grid-template-columns:230px minmax(0, 1fr);
  gap:20px;
  max-width:1200px;
  margin:25px auto;
  padding:0 16px;
">
  <aside style="
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    align-self:start;
  ">
    <h2 style="color:var(--gold);margin-bottom:20px;">
      Menu
    </h2><nav style="display:grid;gap:18px;">
  <a href="index.html">⌂ Home</a>
  <a href="profile.html">♙ Profile</a>
  <a href="app.html">✦ Explore</a>
  <a href="stories.html">◉ Stories</a>
  <a href="chat.html" style="color:var(--gold);">✉ Messages</a>
  <a href="music.html">♫ Music</a>
</nav>

  </aside>  <main style="
    display:grid;
    grid-template-columns:minmax(180px, 250px) minmax(0, 1fr);
    gap:16px;
    min-width:0;
  ">
<section style="
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
      min-width:0;
    ">
      <h2 style="margin-bottom:16px;">Messages</h2>  <button class="contact active"
    data-name="Amara"
    data-letter="A"
    type="button"
    style="
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      padding:12px;
      margin-bottom:8px;
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      text-align:left;
    ">
    <span style="
      display:grid;
      place-items:center;
      width:40px;
      height:40px;
      border-radius:50%;
      background:var(--gold);
      color:#111;
      font-weight:bold;
    ">A</span>
    <span>Amara</span>
  </button>

  <button class="contact"
    data-name="David"
    data-letter="D"
    type="button"
    style="
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      padding:12px;
      margin-bottom:8px;
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      text-align:left;
    ">
    <span style="
      display:grid;
      place-items:center;
      width:40px;
      height:40px;
      border-radius:50%;
      background:var(--gold);
      color:#111;
      font-weight:bold;
    ">D</span>
    <span>David</span>
  </button>

  <button class="contact"
    data-name="Zina"
    data-letter="Z"
    type="button"
    style="
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      padding:12px;
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      text-align:left;
    ">
    <span style="
      display:grid;
      place-items:center;
      width:40px;
      height:40px;
      border-radius:50%;
      background:var(--gold);
      color:#111;
      font-weight:bold;
    ">Z</span>
    <span>Zina</span>
  </button>
</section>
<section style="
      display:flex;
      flex-direction:column;
      min-width:0;
      min-height:500px;
      height:70vh;
      max-height:750px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
    ">
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:16px;
        border-bottom:1px solid var(--border);
      ">
        <div id="chatAvatar" style="
          display:grid;
          place-items:center;
          width:42px;
          height:42px;
          border-radius:50%;
          background:var(--gold);
          color:#111;
          font-weight:bold;
        ">A</div>    <div>
      <strong id="chatName">Amara</strong>
      <p class="muted" style="font-size:12px;margin-top:4px;">
        Kaybgram conversation
      </p>
    </div>
  </div>

  <div id="messages" aria-live="polite" style="
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  ">
    <p class="muted" style="text-align:center;margin:auto;">
      ✦<br><br>
      Say hello!<br><br>
      Type a message below to get started.
    </p>
  </div>

  <form id="messageForm" style="
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
  ">
    <input id="messageInput"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
      aria-label="Write a message"
      style="
        flex:1;
        min-width:0;
        padding:12px;
        border:1px solid var(--border);
        border-radius:10px;
        background:var(--background);
        color:var(--text);
        outline:none;
      ">

    <button type="submit" style="
      padding:12px 16px;
      border:0;
      border-radius:10px;
      background:var(--gold);
      color:#111;
      font-weight:bold;
    ">Send ➤</button>
  </form>
</section>

  </main>
</div>
