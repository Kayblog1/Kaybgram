<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Kaybgram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #111111;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .signup-box {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #1d1d1d;
      border: 1px solid #b88a35;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000066;
    }

    h1 {
      margin-top: 0;
      color: #e7b84b;
      text-align: center;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #cccccc;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555555;
      border-radius: 9px;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #e7b84b;
      border-color: #e7b84b;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #e7b84b;
      color: #111111;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      color: #cccccc;
      font-size: 14px;
    }

    a {
      color: #e7b84b;
    }
  </style>
</head>
