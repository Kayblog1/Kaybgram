<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maxi<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kaybgram App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#111;--card2:#1E1E1E;--border:#252525;--lime:#CCFF00;--pink:#FF2D95}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:'Space Grotesk',Arial;padding-bottom:75px;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid var(--border);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne';font-size:18px;letter-spacing:-1px}.logo span{color:var(--lime)}
.stories{display:flex;gap:10px;overflow-x:auto;padding:12px;scrollbar-width:none}.story{flex:0 0 60px;text-align:center;cursor:pointer}.ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--lime),var(--pink));display:flex;align-items:center;justify-content:center}.ring img{width:100%;height:100%;border-radius:50%;border:2px solid #000;object-fit:cover}
.search-bar{margin:0 12px 8px;background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:9px 14px;display:flex;gap:8px;align-items:center}.search-bar input{background:transparent;border:none;color:#fff;outline:none;width:100%;font-size:13px}
.create{background:var(--card);border:1px solid var(--border);border-radius:18px;margin:8px 12px;padding:12px}
.file-zone{border:1.5px dashed var(--border);border-radius:14px;padding:12px;text-align:center;background:var(--card2);font-size:12px;cursor:pointer}
#preview,#previewVideo{width:100%;border-radius:12px;margin-top:8px;display:none;max-height:380px;object-fit:cover}
.music-list{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.music-chip{flex:0 0 auto;background:#000;border:1px solid var(--border);padding:6px 12px;border-radius:100px;font-size:11px;cursor:pointer;white-space:nowrap}.music-chip.active{background:var(--lime);color:#000;border-color:var(--lime);font-weight:700}
.card{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:6px}.card-top{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;background:var(--lime);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:40}.nav-item{text-align:center;opacity:.5;font-size:9px;cursor:pointer;line-height:1.1}.nav-item.active{opacity:1;color:var(--lime)}.nav-item div{font-size:20px;margin-bottom:2px}
.chat-modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}.chat-header{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--card)}.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.msg{max-width:75%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.3}.msg.me{background:var(--lime);color:#000;align-self:flex-end;border-bottom-right-radius:4px}.msg.other{background:var(--card2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}.chat-input{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--card)}
.btn{border:none;padding:11px;border-radius:100px;font-weight:700;cursor:pointer;width:100%;font-size:13px}.btn-lime{background:var(--lime);color:#000}
</style>
</head>
<body>
<header><div class="logo">KAYBGRAM<span>.</span></div><div style="display:flex;gap:8px;align-items:center"><span id="userLabel" style="font-size:11px;background:#111;padding:4px 8px;border-radius:100px;border:1px solid #222"></span><button style="background:#1a1a1a;color:#fff;border:1px solid #222;padding:6px 12px;border-radius:100px;font-size:11px" onclick="logout()">Logout</button></div></header>

<div style="max-width:700px;margin:0 auto">
<div class="stories" id="stories"></div>
<div class="search-bar"><span>🔍</span><input id="searchInput" placeholder="Search users, captions..." oninput="doSearch()"></div>
<div id="searchResults" style="display:none;padding:0 12px"></div>

<div id="mainContent">
<div class="create">
<div style="display:flex;gap:8px;margin-bottom:10px"><div id="feedTab" style="flex:1;text-align:center;padding:8px;background:var(--lime);color:#000;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer" onclick="setMode('feed')">📸 Feed</div><div id="storyTab" style="flex:1;text-align:center;padding:8px;border:1px solid var(--border);border-radius:100px;font-size:11px;cursor:pointer" onclick="setMode('story')">✨ Story</div></div>
<div class="file-zone" onclick="document.getElementById('fileInput').click()"><span id="zoneText">Tap to add photo / video 📸</span><input type="file" id="fileInput" accept="image/*,video/*" hidden></div>
<img id="preview"><video id="previewVideo" controls playsinline></video>
<input id="caption" placeholder="Caption... what's the vibe?" style="margin-top:10px;background:var(--card2);border:1px solid var(--border);color:#fff;padding:10px 12px;border-radius:12px;width:100%;font-size:13px;outline:none">
<div class="music-list" id="musicList">
<div class="music-chip active" data-url="" data-title="">🔇 No Music</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" data-title="Ayra Starr - Rush">Ayra Starr</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" data-title="Burna Boy - Ye">Burna Boy</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" data-title="Rema - Calm Down">Rema</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" data-title="Davido - Unavailable">Davido</div>
<div class="music-chip" data-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" data-title="Wizkid - Essence">Wizkid</div>
</div>
<button class="btn btn-lime" style="margin-top:10px" id="shareBtn" onclick="createPost()">Drop to Kaybgram →</button>
<p id="status" style="font-size:11px;text-align:center;margin-top:6px;color:var(--lime);min-height:14px"></p>
</div>
<div id="feed"></div>
</div>
</div>

<div class="chat-modal" id="chatModal">
<div class="chat-header"><div><b style="font-family:'Syne'">Global Chat</b> <span style="font-size:10px;opacity:.5">💬 Kaybgram</span></div><button style="background:var(--card2);color:#fff;border:1px solid var(--border);padding:6px 12px;border-radius:100px" onclick="closeChat()">✕</button></div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-input"><input id="chatInput" placeholder="Type message..." style="flex:1;background:var(--card2);border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:100px;outline:none;font-size:13px"><button class="btn btn-lime" style="width:auto;padding:10px 18px" onclick="sendMessage()">Send</button></div>
</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="showHome()"><div>⌂</div>Home</div>
<div class="nav-item" onclick="openChat()"><div>💬</div>Chat</div>
<div class="nav-item" onclick="document.getElementById('fileInput').click()"><div>+</div>Post</div>
<div class="nav-item" onclick="logout()"><div>◍</div>You</div>
</div>

<script>
const SUPABASE_URL="https://qpwmlpisveearglmagvt.supabase.co";
const SUPABASE_KEY="sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=localStorage.getItem('kayb_user');
if(!currentUser){location.href='index.html';}
document.getElementById('userLabel').textContent='@'+currentUser;
let fileData="",fileType="image",mode="feed",selectedMusicUrl="",selectedMusicTitle="",allPosts=[];
function logout(){localStorage.removeItem('kayb_user');location.href='index.html';}
document.querySelectorAll('.music-chip').forEach(c=>{
 c.onclick=()=>{
  document.querySelectorAll('.music-chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  selectedMusicUrl=c.dataset.url;
  selectedMusicTitle=c.dataset.title;
 };
});
function setMode(m){
 mode=m;
 document.getElementById('storyTab').style.background=m==='story'?'var(--lime)':'transparent';
 document.getElementById('storyTab').style.color=m==='story'?'#000':'#fff';
 document.getElementById('feedTab').style.background=m==='story'?'transparent':'var(--lime)';
 document.getElementById('feedTab').style.color=m==='story'?'#fff':'#000';
 document.getElementById('shareBtn').textContent=m==='story'?'Add to Story ✨':'Drop to Kaybgram →';
}
document.getElementById('fileInput').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;
 fileType=file.type.startsWith('video')?'video':'image';
 const reader=new FileReader();
 reader.onload=ev=>{
  if(fileType==='image'){
   const img=new Image();
   img.onload=()=>{
    const canvas=document.createElement('canvas');const max=800;let w=img.width,h=img.height;
    if(w>max){h*=max/w;w=max;}
    canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
    fileData=canvas.toDataURL('image/jpeg',0.7);
    document.getElementById('preview').src=fileData;document.getElementById('preview').style.display='block';document.getElementById('previewVideo').style.display='none';
   };
   img.src=ev.target.result;
  }else{
   fileData=ev.target.result;
   document.getElementById('previewVideo').src=fileData;document.getElementById('previewVideo').style.display='block';document.getElementById('preview').style.display='none';
  }
  document.getElementById('zoneText').textContent=file.name.substring(0,20);
 };
 reader.readAsDataURL(file);
});
async function loadAll(){
 try{
  const {data:posts}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false});
  allPosts=posts||[];
  const feed=document.getElementById('feed');feed.innerHTML="";
  (posts||[]).forEach(p=>{
   const isV=p.image_url?.startsWith('data:video');
   const media=isV?`<video src="${p.image_url}" controls playsinline style="width:100%;display:block;max-height:500px"></video>`:`<img src="${p.image_url}" style="width:100%;display:block">`;
   const music=p.music_url?`<div style="position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);border-radius:100px;padding:6px 10px;font-size:10px;display:flex;align-items:center;gap:6px">🎵 ${p.music_title} <audio src="${p.music_url}" controls style="height:20px;width:90px;margin-left:auto"></audio></div>`:"";
   feed.innerHTML+=`<div class="card"><div class="card-top"><div style="display:flex;gap:8px;align-items:center"><div class="avatar">${(p.username||'K')[0].toUpperCase()}</div><div><b style="font-size:13px">${p.username}</b><div style="font-size:9px;opacity:.4">${new Date(p.created_at).toLocaleDateString()}</div></div></div><span style="font-size:10px;opacity:.4;cursor:pointer;padding:6px" onclick="deletePost(${p.id},'${p.username}')">⋯</span></div><div style="position:relative;background:#000">${media}${music}</div><div style="padding:10px 12px"><div style="display:flex;gap:12px;font-size:14px"><span onclick="likePost(${p.id},${p.likes||0})" style="cursor:pointer">❤️ ${p.likes||0}</span><span>💬</span></div><div style="font-size:13px;margin-top:6px;line-height:1.3"><b>${p.username}</b> ${p.caption||''}</div></div></div>`;
  });
  const {data:storiesData}=await supabaseClient.from('stories').select('*').order('created_at',{ascending:false});
  const valid=(storiesData||[]).filter(s=>(Date.now()-new Date(s.created_at).getTime())<86400000);
  document.getElementById('stories').innerHTML=`<div class="story" onclick="document.getElementById('fileInput').click();setMode('story')"><div class="ring" style="background:#222"><span style="font-size:20px">+</span></div><b style="font-size:9px">Add Story</b></div>`+valid.map(s=>`<div class="story"><div class="ring"><img src="${s.image_url}"></div><b style="font-size:9px">${s.username}</b></div>`).join('');
 }catch(e){console.log(e);}
}
async function createPost(){
 const caption=document.getElementById('caption').value;const btn=document.getElementById('shareBtn');const status=document.getElementById('status');
 if(!fileData){status.textContent="⚠️ Pick photo/video first!";return;}
 btn.textContent="Posting...";btn.disabled=true;
 const table=mode==='story'?'stories':'posts';
 const {error}=await supabaseClient.from(table).insert([{caption,image_url:fileData,username:currentUser,type:fileType,likes:0,music_url:selectedMusicUrl,music_title:selectedMusicTitle}]);
 if(error){status.textContent="Error: "+error.message;btn.disabled=false;btn.textContent=mode==='story'?'Add to Story ✨':'Drop to Kaybgram →';}
 else{status.textContent="🔥 Posted!";fileData="";document.getElementById('preview').style.display='none';document.getElementById('previewVideo').style.display='none';document.getElementById('caption').value="";document.getElementById('zoneText').textContent="Tap to add photo / video 📸";btn.disabled=false;setMode('feed');loadAll();}
}
async function likePost(id,c){await supabaseClient.from('posts').update({likes:c+1}).eq('id',id);loadAll();}
async function deletePost(id,owner){if(owner!==currentUser){alert('Not your post!');return;}if(!confirm('Delete this post?'))return;await supabaseClient.from('posts').delete().eq('id',id);loadAll();}
function doSearch(){
 const q=document.getElementById('searchInput').value.toLowerCase();const res=document.getElementById('searchResults');const main=document.getElementById('mainContent');
 if(!q){res.style.display='none';main.style.display='block';return;}
 main.style.display='none';res.style.display='block';
 const filtered=allPosts.filter(p=>p.username?.toLowerCase().includes(q)||p.caption?.toLowerCase().includes(q));
 res.innerHTML=filtered.length?filtered.map(p=>`<div style="padding:10px;background:#111;border:1px solid #222;border-radius:12px;margin-bottom:6px;font-size:13px;display:flex;gap:8px"><img src="${p.image_url}" style="width:40px;height:40px;border-radius:8px;object-fit:cover"><div><b>${p.username}</b><div style="font-size:11px;opacity:.6">${p.caption||''}</div></div></div>`).join(''):'<p style="padding:20px;text-align:center;opacity:.5">No results for "'+q+'"</p>';
}
function showHome(){document.getElementById('searchResults').style.display='none';document.getElementById('mainContent').style.display='block';document.getElementById('searchInput').value='';}
async function openChat(){document.getElementById('chatModal').style.display='flex';loadMessages();}
function closeChat(){document.getElementById('chatModal').style.display='none';}
async function loadMessages(){
 const {data}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:true}).limit(120);
 const box=document.getElementById('chatMessages');box.innerHTML="";
 (data||[]).forEach(m=>{
  const me=m.sender===currentUser;
  box.innerHTML+=`<div class="msg ${me?'me':'other'}"><b style="font-size:10px;opacity:.6">${m.sender}</b><div style="margin-top:2px">${m.text}</div></div>`;
 });
 box.scrollTop=box.scrollHeight;
}
async function sendMessage(){
 const input=document.getElementById('chatInput');const text=input.value.trim();if(!text)return;
 input.value="";
 await supabaseClient.from('messages').insert([{sender:currentUser,receiver:'global',text}]);
 loadMessages();
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});
loadAll();
setInterval(loadAll,15000);
</script>
</body>
