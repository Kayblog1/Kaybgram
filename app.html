<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaybgram - Feed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:70px}
header{padding:12px;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px}
.nav a{color:#fff;text-decoration:none;font-size:11px;text-align:center;opacity:.5}.nav a.active{opacity:1;color:#CCFF00}
.card{background:#111;border:1px solid #222;margin:10px;border-radius:16px;overflow:hidden}
.btn{width:100%;background:#CCFF00;color:#000;border:none;padding:12px;border-radius:100px;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<header><b style="font-family:'Syne'">KAYBGRAM<span style="color:#CCFF00">.</span></b><span id="u" style="font-size:11px"></span></header>

<div style="max-width:600px;margin:0 auto;padding:10px">
<div style="background:#111;border:1px solid #222;border-radius:16px;padding:12px">
<input type="file" id="f" accept="image/*,video/*" style="width:100%">
<input id="cap" placeholder="Caption..." style="width:100%;margin-top:8px;background:#1a1a1a;border:1px solid #222;color:#fff;padding:10px;border-radius:10px">
<button class="btn" onclick="post()">Post →</button>
<p id="st" style="font-size:11px;color:#CCFF00;text-align:center"></p>
</div>
<div id="feed"></div>
</div>

<div class="nav">
<a href="app.html" class="active"><div>⌂</div>Feed</a>
<a href="chat.html"><div>💬</div>Chat</a>
<a href="stories.html"><div>✨</div>Story</a>
<a href="music.html"><div>🎵</div>Music</a>
</div>

<script>
const supa=supabase.createClient("https://qpwmlpisveearglmagvt.supabase.co","sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB");
let user=localStorage.getItem('kayb_user'); if(!user) location.href='index.html';
document.getElementById('u').textContent='@'+user;
let fileData="";
document.getElementById('f').addEventListener('change',e=>{
 const r=new FileReader(); r.onload=ev=>{ fileData=ev.target.result; }; r.readAsDataURL(e.target.files[0]);
});
async function load(){ const {data}=await supa.from('posts').select('*').order('created_at',{ascending:false}); document.getElementById('feed').innerHTML=(data||[]).map(p=>`<div class="card"><img src="${p.image_url}" style="width:100%"><div style="padding:10px"><b>${p.username}</b> ${p.caption||''}<br><span onclick="like(${p.id},${p.likes||0})" style="cursor:pointer">❤️ ${p.likes||0}</span></div></div>`).join(''); }
async function post(){ if(!fileData) return alert('Pick photo'); document.getElementById('st').textContent='Posting...'; await supa.from('posts').insert([{username:user,image_url:fileData,caption:document.getElementById('cap').value,likes:0}]); document.getElementById('st').textContent='Done!'; fileData=''; load(); }
async function like(id,c){ await supa.from('posts').update({likes:c+1}).eq('id',id); load(); }
load();
</script>
</body>
</html>￼Enter
