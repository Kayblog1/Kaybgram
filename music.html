<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music — Kaybgram</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#09090b;color:#fff;font-family:system-ui;padding-bottom:90px}header{position:sticky;top:0;background:rgba(9,9,11,.95);backdrop-filter:blur(20px);border-bottom:1px solid #232326;padding:14px 16px;display:flex;justify-content:space-between}.logo{font-weight:800;font-size:20px}.logo span{color:#CCFF00}.create{background:#121214;border:1px solid #232326;border-radius:22px;margin:12px;padding:16px;max-width:600px;margin:12px auto}.input{width:100%;background:#1c1c1f;border:1px solid #232326;color:#fff;padding:12px;border-radius:12px;outline:none;margin-top:8px}.btn{width:100%;background:#CCFF00;color:#000;border:none;border-radius:100px;padding:14px;font-weight:800;margin-top:12px}.song{display:flex;gap:12px;align-items:center;background:#121214;border:1px solid #232326;border-radius:16px;padding:12px;margin:10px auto;max-width:600px}.cover{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#CCFF00,#FF2D95);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 56px}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#18181b;border:1px solid #2a2a2e;border-radius:100px;padding:6px;display:flex;gap:4px}.nav a{color:#a1a1aa;text-decoration:none;font-size:11px;font-weight:700;padding:9px 18px;border-radius:100px;text-align:center}.nav a.active{background:#fff;color:#000}</style></head><body><header><div class="logo">MUSIC<span>.</span></div><div style="background:#1c1c1f;border:1px solid #232326;padding:6px 12px;border-radius:100px;font-size:11px;color:#a1a1aa">Kayb FM</div></header><div class="create"><b style="font-size:14px">Drop a track</b><div style="display:flex;gap:8px;margin-top:10px"><input id="title" class="input" style="margin-top:0" placeholder="Song title"><input id="artist" class="input" style="margin-top:0" placeholder="Artist"></div><input id="url" class="input" placeholder="Paste MP3 link (or leave empty)"><button class="btn" onclick="postSong()">Add to Radio →</button></div><div id="list"></div><div id="player" style="display:none;position:fixed;bottom:78px;left:50%;transform:translateX(-50%);width:94%;max-width:600px;background:rgba(18,18,20,.95);backdrop-filter:blur(20px);border:1px solid #232326;border-radius:20px;padding:14px"><div style="display:flex;justify-content:space-between"><b id="pt" style="font-size:13px">Playing</b><span onclick="document.getElementById('player').style.display='none'" style="cursor:pointer">✕</span></div><audio id="aud" controls style="width:100%;margin-top:10px"></audio></div><div class="nav"><a href="app.html">⌂<br>Feed</a><a href="chat.html">💬<br>Chat</a><a href="stories.html">✦<br>Story</a><a href="music.html" class="active">♫<br>Music</a></div><script>const supa=supabase.createClient("https://qpwmlpisveearglmagvt.supabase.co","sb_publishable_-Qo13brD7ZoeOwwtC4sQMQ_X2k8fnlB");let user=localStorage.getItem('kayb_user');if(!user)location.href='index.html';async function load(){const {data}=await supa.from('songs').select('*').order('created_at',{ascending:false});document.getElementById('list').innerHTML=(data||[]).map(s=>`<div class="song" onclick="play('${s.file_url}','${s.title}')"><div class="cover">♫</div><div style="flex:1"><div style="font-weight:700;font-size:13px">${s.title}</div><div style="font-size:11px;color:#a1a1aa">${s.artist} • ${s.username}</div></div><div style="color:#CCFF00">▶</div></div>`).join('')||'<p style="text-align:center;opacity:.4;padding:30px;font-size:13px">No songs yet. Be first DJ!</p>';}function play(url,title){if(!url)return alert('No audio url');document.getElementById('pt').textContent=title;const a=document.getElementById('aud');a.src=url;document.getElementById('player').style.display='block';a.play();}async function postSong(){const t=document.getElementById('title').value,ar=document.getElementById('artist').value,u=document.getElementById('url').value;if(!t||!ar)return alert('Title + Artist needed');await supa.from('songs').insert([{username:user,title:t,artist:ar,file_url:u||'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'}]);document.getElementById('title').value='';document.getElementById('artist').value='';document.getElementById('url').value='';load();}load();</script></body></html>
